<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#1c1917">
  <title>Personal Assistant</title>
  <style>
    :root {
      --bg: #1c1917; --fg: #f5f5f4; --muted: #a8a29e; --card: #292524;
      --live: #dc2626; --idle: #57534e; --accent: #7c2d12;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; background: var(--bg); color: var(--fg);
      font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex; flex-direction: column; align-items: center;
      padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
    }
    #status-bar {
      position: sticky; top: 0; width: 100%; max-width: 480px; margin-top: 12px;
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 16px; border-radius: 12px; background: var(--card);
      font-weight: 600;
    }
    #status-bar.live { background: var(--live); }
    .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--idle); display: inline-block; margin-right: 8px; }
    .live .dot { background: #fff; animation: pulse 1.2s infinite; }
    @keyframes pulse { 50% { opacity: .3; } }
    #elapsed { font-variant-numeric: tabular-nums; }
    main { width: 100%; max-width: 480px; display: flex; flex-direction: column; align-items: center; gap: 20px; margin-top: 32px; }
    #toggle {
      width: 220px; height: 220px; border-radius: 50%; border: none;
      background: var(--accent); color: #fff; font-size: 28px; font-weight: 700;
      box-shadow: 0 8px 24px rgba(0,0,0,.4); cursor: pointer;
    }
    #toggle.live { background: var(--live); }
    #toggle:disabled { opacity: .6; }
    #mark {
      width: 100%; padding: 16px; border-radius: 12px; border: 2px solid var(--muted);
      background: transparent; color: var(--fg); font-size: 18px; font-weight: 600;
    }
    #mark:disabled { opacity: .35; }
    #interrupt {
      display: none; width: 100%; padding: 16px; border-radius: 12px; border: none;
      background: var(--fg); color: var(--bg); font-size: 18px; font-weight: 700;
    }
    #interrupt.shown { display: block; }
    #message { color: var(--muted); min-height: 1.4em; text-align: center; }
    section { width: 100%; }
    h2 { font-size: 14px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 0 0 8px; }
    ul { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; }
    li { background: var(--card); border-radius: 10px; padding: 10px 12px; }
    li time { color: var(--muted); font-variant-numeric: tabular-nums; margin-right: 8px; }
    .quiet { width: 100%; display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 12px; background: var(--card); }
    .quiet input { flex: none; width: 22px; height: 22px; accent-color: var(--accent); }
    .quiet small { display: block; color: var(--muted); }
    li.assistant { border-left: 3px solid var(--accent); }
    li.mark, li.search { background: transparent; border: 1px dashed var(--muted); color: var(--muted); }
    li .who { font-weight: 600; margin-right: 6px; }
    li.pending { color: var(--muted); font-style: italic; }
    #review { display: none; background: var(--card); border-radius: 14px; padding: 16px; gap: 14px; flex-direction: column; }
    #review.shown { display: flex; }
    #review h3 { margin: 0; font-size: 18px; }
    #review h4 { margin: 8px 0 4px; font-size: 14px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
    #review ul { gap: 6px; }
    #review li { background: var(--bg); }
    #review .note { color: var(--muted); font-size: 14px; }
    .candidate { display: grid; grid-template-columns: 28px 1fr; gap: 6px 8px; align-items: start; }
    .candidate input[type=checkbox] { width: 22px; height: 22px; margin-top: 2px; accent-color: var(--accent); }
    .candidate .kind { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
    .candidate textarea {
      grid-column: 2; width: 100%; min-height: 44px; resize: vertical; font: inherit; color: var(--fg);
      background: var(--card); border: 1px solid var(--idle); border-radius: 8px; padding: 8px;
    }
    .candidate select { grid-column: 2; justify-self: start; font: inherit; padding: 6px 8px; border-radius: 8px; background: var(--card); color: var(--fg); border: 1px solid var(--idle); }
    .candidate.saved { opacity: .55; }
    .candidate.saved .kind::after { content: " · saved"; color: #86efac; }
    #save { width: 100%; padding: 14px; border-radius: 10px; border: none; font-size: 16px; font-weight: 700; background: #15803d; color: #fff; }
    #save:disabled { opacity: .45; }
    .toplink { align-self: flex-end; color: var(--muted); font-weight: 600; text-decoration: none; }
    .row { display: flex; gap: 10px; }
    .row button { flex: 1; padding: 14px; border-radius: 10px; border: none; font-size: 16px; font-weight: 600; }
    #copy { background: var(--accent); color: #fff; }
    #discard { background: transparent; color: var(--fg); border: 2px solid var(--muted) !important; }
  </style>
</head>
<body>
  <div id="status-bar" role="status" aria-live="polite">
    <span><span class="dot"></span><span id="state-label">Not listening</span></span>
    <span id="elapsed">00:00</span>
  </div>

  <main>
    <a class="toplink" href="library">Memories →</a>
    <button id="toggle" aria-pressed="false">Start</button>
    <button id="interrupt">✋ Interrupt</button>
    <button id="mark" disabled>★ Mark important</button>
    <label class="quiet">
      <input type="checkbox" id="quiet">
      <span>Quiet mode<small>Just take notes. The assistant won't reply.</small></span>
    </label>
    <label class="quiet">
      <input type="checkbox" id="headphones">
      <span>Using headphones<small>Interrupt by talking. Leave off on speaker: the mic pauses while she talks so she doesn't hear herself.</small></span>
    </label>
    <div id="message">Tap Start to talk. The microphone is off until you do.</div>

    <section id="review" aria-live="polite">
      <h3>Session notes</h3>
      <p class="note">Tick what's worth remembering, edit the wording, and pick where it belongs. Nothing is saved until you tap Save.</p>
      <div id="notes"></div>
      <button id="save" disabled>Save selected</button>
      <div class="row">
        <button id="copy">Copy notes</button>
        <button id="discard">Discard</button>
      </div>
    </section>

    <section>
      <h2>Transcript</h2>
      <ul id="transcript"></ul>
    </section>
  </main>

  <audio id="remote-audio" autoplay playsinline></audio>

  <script>
    const toggleBtn = document.getElementById("toggle");
    const markBtn = document.getElementById("mark");
    const quietBox = document.getElementById("quiet");
    const headphonesBox = document.getElementById("headphones");
    const interruptBtn = document.getElementById("interrupt");
    const statusBar = document.getElementById("status-bar");
    const stateLabel = document.getElementById("state-label");
    const elapsedEl = document.getElementById("elapsed");
    const messageEl = document.getElementById("message");
    const transcriptEl = document.getElementById("transcript");
    const reviewEl = document.getElementById("review");
    const notesEl = document.getElementById("notes");
    const remoteAudio = document.getElementById("remote-audio");

    let pc = null, events = null, micStream = null, startedAt = null, timer = null, stopping = false;
    let accessCode = null, audioInput = null;
    // Echo control: on speaker, the mic is paused while the assistant's audio plays.
    let speaking = false, unmuteTimer = null, muteSafetyTimer = null;
    try { headphonesBox.checked = localStorage.getItem("assistantHeadphones") === "1"; } catch (_) {}
    // Transcript items keyed by the Realtime conversation item id.
    let entries = new Map(), marks = [], searches = [], lastNotesText = "", sessionStartedAt = null;
    const CATEGORIES = [["winery", "Winery"], ["projects", "Projects"], ["personal", "Personal"], ["preferences", "Preferences"]];

    function fmt(ms) {
      const s = Math.floor(ms / 1000);
      return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
    }

    function now() { return startedAt ? Date.now() - startedAt : 0; }

    function setLive(live) {
      statusBar.classList.toggle("live", live);
      toggleBtn.classList.toggle("live", live);
      toggleBtn.textContent = live ? "Stop" : "Start";
      toggleBtn.setAttribute("aria-pressed", String(live));
      stateLabel.textContent = !live ? "Not listening"
        : speaking && !headphonesBox.checked ? "Assistant speaking (mic paused)"
        : quietBox.checked ? "Listening (quiet)" : "Listening";
      markBtn.disabled = !live;
      document.title = live ? "● Listening: Personal Assistant" : "Personal Assistant";
    }

    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    }

    function renderTranscript() {
      const items = [...entries.values()].filter((e) => e.text !== "")
        .map((e) => ({ ...e, kind: e.speaker }))
        .concat(marks.map((t) => ({ t, kind: "mark" })))
        .concat(searches.map((s) => ({ ...s, kind: "search" })))
        .sort((a, b) => a.t - b.t);
      transcriptEl.replaceChildren(...items.map((item) => {
        const li = el("li", item.kind);
        li.append(el("time", "", fmt(item.t)));
        if (item.kind === "mark") {
          li.append("★ Marked important");
        } else if (item.kind === "search") {
          li.append(`🔎 Searched memories for "${item.query}": ${item.summary}`);
        } else {
          li.append(el("span", "who", item.speaker === "assistant" ? "Assistant:" : "You:"));
          if (item.text === null) li.classList.add("pending");
          li.append(item.text === null ? "…" : item.text);
        }
        return li;
      }));
    }

    function upsert(id, speaker, fields) {
      const entry = entries.get(id) || { t: now(), speaker, text: null };
      Object.assign(entry, fields);
      entries.set(id, entry);
      renderTranscript();
    }

    function turnDetection() {
      const reply = !quietBox.checked;
      return {
        type: "session.update",
        session: {
          type: "realtime",
          audio: {
            input: {
              ...audioInput,
              turn_detection: { type: "server_vad", create_response: reply, interrupt_response: reply },
            },
          },
        },
      };
    }

    function setMic(enabled) {
      micStream?.getAudioTracks().forEach((t) => { t.enabled = enabled; });
    }

    function setSpeaking(on) {
      speaking = on;
      clearTimeout(unmuteTimer);
      clearTimeout(muteSafetyTimer);
      interruptBtn.classList.toggle("shown", on);
      if (on) {
        if (!headphonesBox.checked) setMic(false);
        // Never leave the mic paused indefinitely if a "stopped" event goes missing.
        muteSafetyTimer = setTimeout(() => setSpeaking(false), 60000);
      } else {
        // Short tail so the end of her last word doesn't echo back in.
        unmuteTimer = setTimeout(() => setMic(true), 400);
      }
      if (pc) setLive(true);
    }

    function interrupt() {
      if (events?.readyState === "open") {
        events.send(JSON.stringify({ type: "response.cancel" }));
        events.send(JSON.stringify({ type: "output_audio_buffer.clear" }));
      }
      setSpeaking(false);
      clearTimeout(unmuteTimer);
      setMic(true);
    }

    function sendEvent(event) {
      if (events?.readyState === "open") events.send(JSON.stringify(event));
    }

    // The assistant asked to search memories: run it, hand back the results, and let her answer.
    async function runToolCall(call) {
      let output;
      const search = { t: now(), query: "", summary: "searching…" };
      try {
        const args = JSON.parse(call.arguments || "{}");
        search.query = args.query || "";
        searches.push(search);
        renderTranscript();
        if (call.name !== "search_memories") throw new Error(`Unknown tool ${call.name}`);
        const resp = await fetch("memories/search", {
          method: "POST",
          headers: { "Content-Type": "application/json", "X-Access-Code": accessCode },
          body: JSON.stringify({ query: args.query, category: args.category }),
        });
        const data = await resp.json();
        if (!resp.ok) throw new Error(data.error || "Search failed");
        search.summary = data.results.length ? `${data.results.length} found` : "nothing found";
        output = {
          results: data.results.map((m) => ({
            memory: m.text,
            category: m.category,
            from: (m.session_started_at || m.created_at || "").slice(0, 10),
            relevance: m.score,
          })),
        };
      } catch (err) {
        search.summary = `failed (${err.message})`;
        output = { error: `Memory search is unavailable: ${err.message}` };
      }
      renderTranscript();
      sendEvent({ type: "conversation.item.create", item: { type: "function_call_output", call_id: call.call_id, output: JSON.stringify(output) } });
      sendEvent({ type: "response.create" });
    }

    function handleEvent(evt) {
      switch (evt.type) {
        case "response.done":
          (evt.response?.output || [])
            .filter((item) => item.type === "function_call")
            .forEach(runToolCall);
          break;
        case "output_audio_buffer.started":
          setSpeaking(true);
          break;
        case "output_audio_buffer.stopped":
        case "output_audio_buffer.cleared":
          setSpeaking(false);
          break;
        case "input_audio_buffer.speech_started":
          upsert(evt.item_id, "user", {});
          break;
        case "conversation.item.input_audio_transcription.completed":
          upsert(evt.item_id, "user", { text: (evt.transcript || "").trim() });
          break;
        case "conversation.item.input_audio_transcription.failed":
          upsert(evt.item_id, "user", { text: "[inaudible]" });
          break;
        case "response.output_audio_transcript.delta":
          if (!entries.has(evt.item_id)) upsert(evt.item_id, "assistant", {});
          break;
        case "response.output_audio_transcript.done":
          upsert(evt.item_id, "assistant", { text: (evt.transcript || "").trim() });
          break;
        case "error":
          messageEl.textContent = evt.error?.message || "Voice service error";
          break;
      }
    }

    async function start() {
      if (reviewEl.classList.contains("shown") && !confirm("Start a new session? The current notes will be discarded.")) return;
      toggleBtn.disabled = true;
      messageEl.textContent = "Connecting…";
      try {
        try { accessCode = localStorage.getItem("assistantAccessCode"); } catch (_) {}
        if (!accessCode) accessCode = prompt("Access code");
        if (!accessCode) throw new Error("An access code is needed to start.");

        const sessionResp = await fetch("session", {
          method: "POST",
          headers: { "X-Access-Code": accessCode },
        });
        const session = await sessionResp.json();
        if (sessionResp.status === 401) {
          try { localStorage.removeItem("assistantAccessCode"); } catch (_) {}
        }
        if (!sessionResp.ok) throw new Error(session.error || "Could not start a session");
        try { localStorage.setItem("assistantAccessCode", accessCode); } catch (_) {}
        audioInput = session.audio_input || { transcription: { model: session.transcription_model } };

        discard();
        pc = new RTCPeerConnection();
        pc.ontrack = (e) => { remoteAudio.srcObject = e.streams[0]; };
        pc.onconnectionstatechange = () => {
          if (["failed", "disconnected"].includes(pc?.connectionState)) {
            stop("Connection lost. The microphone is off.");
          }
        };

        micStream = await navigator.mediaDevices.getUserMedia({
          audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
        });
        micStream.getTracks().forEach((track) => pc.addTrack(track, micStream));

        events = pc.createDataChannel("oai-events");
        events.onopen = () => events.send(JSON.stringify(turnDetection()));
        events.onmessage = (e) => handleEvent(JSON.parse(e.data));

        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);
        const sdpResp = await fetch("https://api.openai.com/v1/realtime/calls", {
          method: "POST",
          body: offer.sdp,
          headers: {
            Authorization: `Bearer ${session.client_secret}`,
            "Content-Type": "application/sdp",
          },
        });
        if (!sdpResp.ok) {
          let detail = `HTTP ${sdpResp.status}`;
          try { detail += ": " + ((await sdpResp.json()).error?.message || ""); } catch (_) {}
          throw new Error(`Voice service rejected the connection (${detail})`);
        }
        await pc.setRemoteDescription({ type: "answer", sdp: await sdpResp.text() });

        startedAt = Date.now();
        sessionStartedAt = new Date(startedAt).toISOString();
        timer = setInterval(() => { elapsedEl.textContent = fmt(now()); }, 500);
        setLive(true);
        messageEl.textContent = quietBox.checked
          ? "Taking notes quietly. Tap Stop when you're done."
          : "Listening. Just talk; tap Stop to turn the microphone off.";
      } catch (err) {
        stop(err.message || String(err), { summarize: false });
      } finally {
        toggleBtn.disabled = false;
      }
    }

    async function stop(message, { summarize = true } = {}) {
      if (stopping) return;
      // Release the microphone first so the OS indicator turns off right away.
      micStream?.getTracks().forEach((t) => t.stop());
      micStream = null;
      speaking = false;
      clearTimeout(unmuteTimer);
      clearTimeout(muteSafetyTimer);
      interruptBtn.classList.remove("shown");
      clearInterval(timer);
      timer = null;
      setLive(false);
      if (!pc) { messageEl.textContent = message || ""; return; }

      stopping = true;
      toggleBtn.disabled = true;
      messageEl.textContent = "Finishing the transcript…";
      // Give the last utterance a moment to finish transcribing.
      const deadline = Date.now() + 3000;
      while (Date.now() < deadline && [...entries.values()].some((e) => e.text === null)) {
        await new Promise((r) => setTimeout(r, 200));
      }
      pc?.close();
      pc = null;
      events = null;
      for (const [id, e] of entries) if (e.text === null) entries.delete(id);
      renderTranscript();

      if (summarize && entries.size) {
        await summarizeSession(message);
      } else {
        messageEl.textContent = message || "Stopped. The microphone is off.";
      }
      stopping = false;
      toggleBtn.disabled = false;
    }

    async function summarizeSession(message) {
      messageEl.textContent = "Microphone off. Writing your notes…";
      try {
        const resp = await fetch("summarize", {
          method: "POST",
          headers: { "Content-Type": "application/json", "X-Access-Code": accessCode },
          body: JSON.stringify({ entries: [...entries.values()], marks }),
        });
        const data = await resp.json();
        if (!resp.ok) throw new Error(data.error || "Could not write notes");
        showNotes(data.notes);
        messageEl.textContent = message || "Stopped. The microphone is off.";
      } catch (err) {
        messageEl.textContent = `Microphone off. Notes failed: ${err.message}`;
      }
    }

    function candidateRow(kind, text, category) {
      const li = el("li", "candidate");
      const box = el("input");
      box.type = "checkbox";
      const label = el("span", "kind", kind);
      const area = el("textarea");
      area.value = text;
      area.rows = Math.min(6, Math.ceil(text.length / 38));
      const select = el("select");
      CATEGORIES.forEach(([value, name]) => {
        const option = el("option", "", name);
        option.value = value;
        select.append(option);
      });
      select.value = category;
      box.addEventListener("change", updateSaveButton);
      li.append(box, label, area, select);
      return li;
    }

    function selectedCandidates() {
      return [...notesEl.querySelectorAll("li.candidate:not(.saved)")]
        .filter((li) => li.querySelector("input").checked);
    }

    function updateSaveButton() {
      const n = selectedCandidates().length;
      const saveBtn = document.getElementById("save");
      saveBtn.disabled = n === 0;
      saveBtn.textContent = n ? `Save ${n} to memory` : "Save selected";
    }

    async function saveSelected() {
      const rows = selectedCandidates();
      const memories = rows.map((li) => ({
        text: li.querySelector("textarea").value.trim(),
        category: li.querySelector("select").value,
      }));
      if (memories.some((m) => !m.text)) {
        messageEl.textContent = "One of the ticked memories is empty. Add text or untick it.";
        return;
      }
      const saveBtn = document.getElementById("save");
      saveBtn.disabled = true;
      saveBtn.textContent = "Saving…";
      try {
        const resp = await fetch("memories", {
          method: "POST",
          headers: { "Content-Type": "application/json", "X-Access-Code": accessCode },
          body: JSON.stringify({ memories, session_started_at: sessionStartedAt }),
        });
        const data = await resp.json();
        if (!resp.ok) throw new Error(data.error || "Could not save");
        rows.forEach((li) => {
          li.classList.add("saved");
          li.querySelectorAll("input, textarea, select").forEach((c) => { c.disabled = true; });
        });
        messageEl.textContent = `Saved ${data.memories.length} ${data.memories.length === 1 ? "memory" : "memories"}.`;
      } catch (err) {
        messageEl.textContent = `Not saved: ${err.message}`;
      }
      updateSaveButton();
    }

    function showNotes(notes) {
      const action = (a) => a.task + (a.owner ? ` (${a.owner})` : "") + (a.due ? `, due ${a.due}` : "");
      const moment = (m) => `${m.time ? m.time + " " : ""}${m.note}`;
      const category = notes.category || "winery";
      const rows = [];
      if (notes.summary) rows.push(candidateRow("Summary", notes.summary, category));
      // Prefix the type so each memory still makes sense when read on its own later.
      notes.decisions.forEach((d) => rows.push(candidateRow("Decision", `Decided: ${d}`, category)));
      notes.action_items.forEach((a) => rows.push(candidateRow("Action item", `To do: ${action(a)}`, category)));
      notes.promises.forEach((p) => rows.push(candidateRow("Promise", `Promised: ${p}`, category)));
      notes.questions.forEach((q) => rows.push(candidateRow("Open question", `Open question: ${q}`, category)));
      notes.important_moments.forEach((m) => rows.push(candidateRow("Marked moment", m.note, category)));
      const list = el("ul");
      list.append(...rows);
      notesEl.replaceChildren(rows.length ? list : el("p", "", "No notes came out of this session."));
      updateSaveButton();
      const block = (title, items, render = (x) => x) =>
        items.length ? `\n${title}:\n` + items.map((i) => `- ${render(i)}`).join("\n") + "\n" : "";
      lastNotesText = `Session notes (${new Date().toLocaleString()})\n\n${notes.summary}\n`
        + block("Decisions", notes.decisions)
        + block("Action items", notes.action_items, action)
        + block("Promises", notes.promises)
        + block("Open questions", notes.questions)
        + block("Marked moments", notes.important_moments, moment);
      reviewEl.classList.add("shown");
      reviewEl.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    function discard() {
      entries = new Map();
      marks = [];
      searches = [];
      lastNotesText = "";
      sessionStartedAt = null;
      notesEl.replaceChildren();
      reviewEl.classList.remove("shown");
      renderTranscript();
    }

    toggleBtn.addEventListener("click", () => (pc ? stop() : start()));
    markBtn.addEventListener("click", () => { marks.push(now()); renderTranscript(); });
    interruptBtn.addEventListener("click", interrupt);
    document.getElementById("save").addEventListener("click", saveSelected);
    headphonesBox.addEventListener("change", () => {
      try { localStorage.setItem("assistantHeadphones", headphonesBox.checked ? "1" : "0"); } catch (_) {}
      if (headphonesBox.checked) setMic(true);
      else if (speaking) setMic(false);
      if (pc) setLive(true);
    });
    quietBox.addEventListener("change", () => {
      if (events?.readyState === "open") events.send(JSON.stringify(turnDetection()));
      if (pc) setLive(true);
    });
    document.getElementById("copy").addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(lastNotesText);
        messageEl.textContent = "Notes copied. Paste them wherever you keep notes.";
      } catch (_) {
        messageEl.textContent = "Couldn't copy automatically. Select the notes and copy them.";
      }
    });
    document.getElementById("discard").addEventListener("click", () => {
      discard();
      messageEl.textContent = "Discarded. Nothing was saved.";
    });
  </script>
</body>
</html>
